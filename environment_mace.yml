# Usage: mamba env create -n myenvname -f environment_mace.yml
---
name: mlptrain-mace
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10
  - pip
  - libgfortran=14.*
  - ase
  - autode=1.4.5
  - coloredlogs
  - cython
  - dscribe>=2.0
  - matplotlib-base>=3.9.0
  - numpy
  - py-plumed
  - scipy
  - xtb
  - scikit-learn
  - openmm=8.1.2
  - openmm-torch=1.4
  - nnpops
  - openmm-ml=1.2
  - git
  - seaborn
  - cuequivariance
  - cuequivariance-torch
  - pip:
    - ase@git+https://gitlab.com/ase/ase.git@f2615a6e9a # For PLUMED
    - git+https://github.com/Radiance-Technologies/mace.git@dev
    - cuequivariance-ops-torch-cu13
