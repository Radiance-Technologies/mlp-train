repos:
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
  - repo: https://github.com/google/yapf
    rev: v0.40.2
    hooks:
      - id: yapf
        additional_dependencies: [toml, tomli]
        require_serial: true
  - repo: https://github.com/PyCQA/docformatter
    rev: eb1df347edd128b30cd3368dddc3aa65edcfac38
    hooks:
      - id: docformatter
        args:
          [
            -i,
            --wrap-summaries,
            "72",
            --wrap-descriptions,
            "72",
            --tab-width,
            "4",
            --make-summary-multi-line,
            --pre-summary-newline,
          ]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: debug-statements
      - id: check-merge-conflict
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.2
    hooks:
      - id: ruff
        name: ruff
        description: ruff linting
        stages:
        - pre-commit
        language: python
        args:
        - --fix
        - --exit-non-zero-on-fix
        types:
        - python
    # - id: ruff
    #   name: sort imports with ruff
    #   args: [--select, I, --fix]
    #   stages:
    #     - commit
    #   language: python
    #   types:
    #     - python
    # - id: ruff-format
    #   name: ruff format
    #   description: ruff autoformat
    #   stages:
    #     - commit
    #   language: python
    #   types:
    #     - python
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.23.1
    hooks:
      - id: toml-sort
      - id: toml-sort-fix
  # Clear notebook metadata
  - repo: https://github.com/datarootsio/databooks
    rev: 1.3.10
    hooks:
      - id: databooks-meta
        args: [--cell-fields-keep=id]
  # Clear notebook outputs
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
    - id: nbstripout
  # Notebook formatting, linting, etc.
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-ruff
      - id: nbqa-isort
      - id: nbqa-yapf
  - repo: https://github.com/lk16/detect-missing-init
    rev: v0.1.6
    hooks:
      - id: detect-missing-init
        args: ["--create", "--track", "--python-folders", "mlptrain"]
  # Validate docstrings
  - repo: https://github.com/numpy/numpydoc
    rev: v1.8.0
    hooks:
      - id: numpydoc-validation
  # Static type checking
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: pixi run -e all python run_mypy.py
        language: system
        types: [python]
        require_serial: true
        verbose: true
        pass_filenames: false
